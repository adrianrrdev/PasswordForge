<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Password Forge — secure password generator built with HTML, CSS and JavaScript."
    >

    <title>Password Forge</title>


    <!-- =========================
         GOOGLE FONTS
    ========================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Bungee&family=Lexend+Deca:wght@400;500;600;700&family=Spline+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- =========================
         CSS
    ========================== -->

    <link
        rel="stylesheet"
        href="style.css"
    >


    <!-- =========================
         FAVICON
    ========================== -->

    <link
        rel="icon"
        type="image/png"
        href="icono.png"
    >

</head>


<body>

    <main class="container">


        <!-- =========================
             HERO
        ========================== -->

        <section class="hero">

            <div class="hero-top">

                <p
                    class="eyebrow"
                    data-i18n="eyebrow"
                >
                    PROJECT Z · TOOL #001
                </p>


                <!-- =========================
                     LANGUAGE SELECTOR
                ========================== -->

                <div class="language-selector">

                    <span
                        class="language-icon"
                        aria-hidden="true"
                    >
                        ◎
                    </span>


                    <label
                        for="language"
                        class="sr-only"
                        data-i18n="languageSelector"
                    >
                        Language
                    </label>


                    <select
                        id="language"
                        aria-label="Language"
                        onchange="cambiarIdioma()"
                    >

                        <option value="en">
                            EN
                        </option>

                        <option value="es">
                            ES
                        </option>

                        <option value="fr">
                            FR
                        </option>

                        <option value="de">
                            DE
                        </option>

                        <option value="it">
                            IT
                        </option>

                    </select>

                </div>

            </div>


            <h1 data-i18n="title">
                Password Forge
            </h1>


            <p
                class="subtitle"
                data-i18n="subtitle"
            >
                Create strong and secure passwords in seconds.
            </p>

        </section>



        <!-- =========================
             PASSWORD CARD
        ========================== -->

        <section class="password-card">


            <!-- =========================
                 PASSWORD
            ========================== -->

            <div class="password-section">

                <span
                    class="section-label"
                    data-i18n="passwordLabel"
                >
                    Password
                </span>


                <div class="password-output">

                    <div class="password-row">

                        <p
                            id="passwordDisplay"
                            aria-live="polite"
                        >
                            ••••••••••••••••
                        </p>


                        <!-- =========================
                             EYE BUTTON
                        ========================== -->

                        <button
                            type="button"
                            class="eye-button"
                            id="eyeButton"
                            onclick="mostrarOcultarPassword()"
                            aria-label="Show password"
                            aria-pressed="false"
                            title="Show password"
                        >

                            <div class="eye-face">

                                <div class="eye-ball">

                                    <div class="eye-pupil"></div>

                                </div>


                                <div class="eye-ball">

                                    <div class="eye-pupil"></div>

                                </div>

                            </div>

                        </button>

                    </div>

                </div>


                <!-- =========================
                     PASSWORD STRENGTH
                ========================== -->

                <div
                    class="strength"
                    id="strength"
                >

                    <div class="strength-header">

                        <span data-i18n="strengthLabel">
                            Password strength
                        </span>


                        <strong id="strengthText">
                            Waiting
                        </strong>

                    </div>


                    <div
                        class="strength-bar"
                        aria-hidden="true"
                    >

                        <span
                            class="strength-segment"
                            id="strength1"
                        ></span>

                        <span
                            class="strength-segment"
                            id="strength2"
                        ></span>

                        <span
                            class="strength-segment"
                            id="strength3"
                        ></span>

                        <span
                            class="strength-segment"
                            id="strength4"
                        ></span>

                    </div>

                </div>

            </div>



            <!-- =========================
                 SETTINGS
            ========================== -->

            <div class="settings-layout">


                <!-- =========================
                     LENGTH
                ========================== -->

                <div class="length-section">

                    <span
                        class="section-label"
                        data-i18n="lengthLabel"
                    >
                        Length
                    </span>


                    <input
                        type="number"
                        id="longitud"
                        min="4"
                        max="64"
                        value="16"
                        inputmode="numeric"
                        aria-label="Password length"
                    >

                </div>



                <!-- =========================
                     CHARACTER SET
                ========================== -->

                <div class="character-section">

                    <span
                        class="section-label"
                        data-i18n="characterSetLabel"
                    >
                        Character Set
                    </span>


                    <div class="options">


                        <!-- UPPERCASE -->

                        <label class="checkbox">

                            <input
                                type="checkbox"
                                id="mayusculas"
                                checked
                            >

                            <span class="check-box"></span>


                            <span class="checkbox-text">

                                <strong data-i18n="uppercase">
                                    Uppercase
                                </strong>

                                <small>
                                    A–Z
                                </small>

                            </span>

                        </label>



                        <!-- LOWERCASE -->

                        <label class="checkbox">

                            <input
                                type="checkbox"
                                id="minusculas"
                                checked
                            >

                            <span class="check-box"></span>


                            <span class="checkbox-text">

                                <strong data-i18n="lowercase">
                                    Lowercase
                                </strong>

                                <small>
                                    a–z
                                </small>

                            </span>

                        </label>



                        <!-- NUMBERS -->

                        <label class="checkbox">

                            <input
                                type="checkbox"
                                id="numeros"
                                checked
                            >

                            <span class="check-box"></span>


                            <span class="checkbox-text">

                                <strong data-i18n="numbers">
                                    Numbers
                                </strong>

                                <small>
                                    0–9
                                </small>

                            </span>

                        </label>



                        <!-- SYMBOLS -->

                        <label class="checkbox">

                            <input
                                type="checkbox"
                                id="simbolos"
                                checked
                            >

                            <span class="check-box"></span>


                            <span class="checkbox-text">

                                <strong data-i18n="symbols">
                                    Symbols
                                </strong>

                                <small>
                                    !@#$...
                                </small>

                            </span>

                        </label>


                    </div>

                </div>

            </div>



            <!-- =========================
                 ACTIONS
            ========================== -->

            <div class="actions">


                <!-- COPY -->

                <button
                    type="button"
                    class="copy-button disabled"
                    id="copyButton"
                    onclick="copiarPassword()"
                    aria-label="Copy password"
                    title="Copy password"
                >

                    <svg
                        class="copy-icon"
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <rect
                            x="8"
                            y="8"
                            width="10"
                            height="10"
                            rx="2"
                        ></rect>


                        <path
                            d="
                                M6 16H5
                                A2 2 0 0 1 3 14
                                V5
                                A2 2 0 0 1 5 3
                                H14
                                A2 2 0 0 1 16 5
                                V6
                            "
                        ></path>

                    </svg>


                    <span
                        class="copy-check"
                        aria-hidden="true"
                    >
                        ✓
                    </span>

                </button>



                <!-- GENERATE -->

                <button
                    type="button"
                    class="primary-button"
                    onclick="generarPassword()"
                    data-i18n="generate"
                >
                    Generate password
                </button>


            </div>


        </section>



        <!-- =========================
             FOOTER
        ========================== -->

        <footer data-i18n="footer">

            Built with HTML & CSS · ProyectoZ

        </footer>


    </main>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="script.js"></script>

</body>

</html>
